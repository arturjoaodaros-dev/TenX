<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TenX – Cadastro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Criar conta</h1>
    <p class="subtitle">Preencha os dados para se cadastrar.</p>

    <div id="feedback" class="feedback" role="alert" hidden></div>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required aria-describedby="nome-error">
        <p id="nome-error" class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
        <p id="email-error" class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required aria-describedby="senha-error">
        <p id="senha-error" class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required aria-describedby="confirmar-error">
        <p id="confirmar-error" class="field-error" hidden></p>
      </div>

      <button type="submit" id="submit" class="primary">Cadastrar</button>
    </form>

    <p class="alt-link">Já tem conta? <a href="index.html">Entrar</a></p>
  </main>
  <script src="cadastro.js"></script>
</body>
</html>
