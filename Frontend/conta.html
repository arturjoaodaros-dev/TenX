<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TenX – Minha conta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Minha conta</h1>
    <p class="subtitle"><a href="home.html">← Voltar ao início</a></p>

    <div id="feedback" class="feedback" role="alert" hidden></div>

    <dl class="info">
      <dt>ID do usuário</dt>
      <dd id="usuario-id">—</dd>
    </dl>

    <form id="update-form" novalidate>
      <div class="field">
        <label for="nome">Novo nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Novo e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="senha">Nova senha</label>
        <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8">
      </div>
      <p class="subtitle">Preencha apenas o que deseja alterar.</p>
      <button type="submit" id="update-submit" class="primary">Salvar alterações</button>
    </form>

    <h2 class="section-title">Sair ou excluir</h2>
    <div class="stack">
      <button type="button" id="logout" class="secondary">Sair da conta</button>
      <button type="button" id="delete-open" class="danger">Excluir conta</button>
    </div>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="delete-form" novalidate>
      <h2 id="dialog-title">Excluir conta</h2>
      <p>Esta ação não pode ser desfeita. Informe sua senha para confirmar.</p>
      <div class="field">
        <label for="delete-senha">Senha</label>
        <input id="delete-senha" type="password" autocomplete="current-password" required>
      </div>
      <p id="dialog-error" class="field-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="delete-cancel" class="secondary">Cancelar</button>
        <button type="submit" id="delete-submit" class="danger solid">Excluir</button>
      </div>
    </form>
  </dialog>

  <script src="conta.js"></script>
</body>
</html>
