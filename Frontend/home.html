<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TenX – Início</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <header class="topbar">
    <h1>TenX</h1>
    <a href="conta.html">Minha conta</a>
  </header>

  <div id="feedback" class="feedback" role="alert" hidden></div>

  <main class="grid">
    <section class="card" aria-labelledby="t-materias">
      <h2 id="t-materias">Matérias</h2>
      <form id="form-materia" novalidate>
        <div class="field">
          <label for="materia-nome">Nome</label>
          <input id="materia-nome" type="text" required>
        </div>
        <button type="submit" class="primary">Cadastrar matéria</button>
      </form>
      <ul id="lista-materias" class="list" aria-live="polite"></ul>
    </section>

    <section class="card" aria-labelledby="t-bobicas">
      <h2 id="t-bobicas">Bobicas</h2>
      <form id="form-bobica" novalidate>
        <div class="field">
          <label for="bobica-nome">Nome</label>
          <input id="bobica-nome" type="text" required>
        </div>
        <div class="field">
          <label for="bobica-preco">Preço médio (R$)</label>
          <input id="bobica-preco" type="number" min="0" step="0.01" inputmode="decimal" required>
        </div>
        <button type="submit" class="primary">Cadastrar bobica</button>
      </form>
      <ul id="lista-bobicas" class="list" aria-live="polite"></ul>
    </section>

    <section class="card" aria-labelledby="t-provas">
      <h2 id="t-provas">Provas</h2>
      <form id="form-prova" novalidate>
        <div class="field">
          <label for="prova-materia">Matéria</label>
          <select id="prova-materia" required></select>
        </div>
        <div class="field">
          <label for="prova-bobica">Bobica</label>
          <select id="prova-bobica" required></select>
        </div>
        <button type="submit" class="primary">Cadastrar prova</button>
      </form>
      <ul id="lista-provas" class="list" aria-live="polite"></ul>
    </section>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="dialog-form" novalidate>
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p id="dialog-error" class="field-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-cancel" class="secondary">Cancelar</button>
        <button type="submit" id="dialog-submit" class="primary"></button>
      </div>
    </form>
  </dialog>

  <script src="home.js"></script>
</body>
</html>
