<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TenX – Entrar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>TenX</h1>
    <p class="subtitle">Entre na sua conta para continuar.</p>

    <div id="feedback" class="feedback" role="alert" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required aria-describedby="email-error">
        <p id="email-error" class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="password-wrap">
          <input id="senha" name="senha" type="password" autocomplete="current-password" required aria-describedby="senha-error">
          <button type="button" id="toggle-senha" class="link-button" aria-controls="senha" aria-pressed="false">Mostrar</button>
        </div>
        <p id="senha-error" class="field-error" hidden></p>
      </div>

      <button type="submit" id="submit" class="primary">Entrar</button>
    </form>

    <p class="alt-link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
